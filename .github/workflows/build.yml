name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.11.1'

    - name: Build Debug APK
      run: gradle assembleDebug --stacktrace

    - name: Rename APK for Release
      run: |
        cp app/build/outputs/apk/debug/app-debug.apk SolarSystemWallpaper-v1.0.3.apk

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SolarSystemWallpaper-v1.0.3-APK
        path: SolarSystemWallpaper-v1.0.3.apk
        retention-days: 30

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      if: github.ref == 'refs/heads/main'
      with:
        tag_name: v1.0.3
        name: Solar System Live Wallpaper v1.0.3
        body: |
          Solar System Live Wallpaper v1.0.3 (Super Wallpaper & Procedural Textures):
          - Added Xiaomi Super Wallpaper style unlock zoom-in flyover and home-screen swipe orbital sweep.
          - Added planet selector bar in the main app and Settings (Earth, Saturn, Mars, Jupiter, Sun, Mercury, Venus, Uranus, Neptune, or All Solar System).
          - Upgraded all planet textures to seamless 3D spherical fBm procedural generation (continents, ocean bathymetry, topographic normal map, city night lights, clouds, Jupiter Great Red Spot, Saturn Cassini-division rings, Mars craters & polar caps).
        files: SolarSystemWallpaper-v1.0.3.apk
        token: ${{ secrets.GITHUB_TOKEN }}