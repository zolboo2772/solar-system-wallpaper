name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.11.1'

    - name: Build Debug APK
      run: gradle assembleDebug --stacktrace

    - name: Rename APK for Release
      run: |
        cp app/build/outputs/apk/debug/app-debug.apk SolarSystemWallpaper-v1.0.0.apk

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SolarSystemWallpaper-v1.0.0-APK
        path: SolarSystemWallpaper-v1.0.0.apk
        retention-days: 30

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      if: github.ref == 'refs/heads/main'
      with:
        tag_name: v1.0.0
        name: Solar System Live Wallpaper v1.0.0
        body: |
          ### 🪐 Solar System Live Wallpaper v1.0.0 (Samsung Galaxy S25 Ultra)
          
          Interactive 3D Solar System live wallpaper rendered with OpenGL ES 3.2 and PBR shaders.
          
          #### Features:
          - Realistic PBR lighting on all 8 planets + Sun
          - Atmospheric rim scattering (Earth, Venus, Mars, Uranus, Neptune)
          - Earth night-side city lights + dynamic cloud layer
          - Saturn rings with planetary shadow projection
          - Procedural solar corona flares & twinkling 3D starfield skybox
          - Interactive touch: orbit swipe, pinch-zoom, tap-to-focus planet HUD
          - 60 FPS LTPO display support + zero background battery drain
          
          Download the APK below and install it directly on your device.
        files: SolarSystemWallpaper-v1.0.0.apk
        token: ${{ secrets.GITHUB_TOKEN }}
