name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.11.1'

    - name: Build Debug APK
      run: gradle assembleDebug --stacktrace

    - name: Rename APK for Release
      run: |
        cp app/build/outputs/apk/debug/app-debug.apk SolarSystemWallpaper-v1.0.2.apk

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SolarSystemWallpaper-v1.0.2-APK
        path: SolarSystemWallpaper-v1.0.2.apk
        retention-days: 30

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      if: github.ref == 'refs/heads/main'
      with:
        tag_name: v1.0.2
        name: Solar System Live Wallpaper v1.0.2
        body: |
          Solar System Live Wallpaper v1.0.2 Update:
          - Fixed sphere triangle winding order (CCW) to prevent back-face culling drops.
          - Disabled culling during skybox rendering for full 360-degree starfield.
          - Added idempotent surfaceCreated and surfaceDestroyed lifecycle guards.
          - Enhanced high-resolution procedural textures for planets, rings, and sun.
          - Added interactive touch gesture listener to 3D preview view.
          - Guarded projection matrices against zero/negative viewport dimensions.
          - Safely queued GL release calls onto the GL thread.
        files: SolarSystemWallpaper-v1.0.2.apk
        token: ${{ secrets.GITHUB_TOKEN }}