name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.11.1'

    - name: Build Debug APK
      run: gradle assembleDebug --stacktrace

    - name: Rename APK for Release
      run: |
        cp app/build/outputs/apk/debug/app-debug.apk SolarSystemWallpaper-v1.0.5.apk

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SolarSystemWallpaper-v1.0.5-APK
        path: SolarSystemWallpaper-v1.0.5.apk
        retention-days: 30

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      if: github.ref == 'refs/heads/main'
      with:
        tag_name: v1.0.5
        name: Solar System Live Wallpaper v1.0.5
        body: |
          Solar System Live Wallpaper v1.0.5:
          - Replaced GLSurfaceView wrapper inside WallpaperService with a native EGL14 render engine so planets reliably render on both Home Screen and Lock Screen.
          - Fixed camera initial target snapping (planets are centered immediately on first frame and during unlock fly-in).
          - Added adaptive portrait FOV so planets and Saturn's rings frame completely on tall displays (Galaxy S25 Ultra).
          - Eliminated GLSL pow(0.0) NaN edge cases across shaders and cached procedural textures across engines.
          - Redesigned Cosmos Studio UI with custom vector icons and 3D lit planet orb cards.
        files: SolarSystemWallpaper-v1.0.5.apk
        token: ${{ secrets.GITHUB_TOKEN }}