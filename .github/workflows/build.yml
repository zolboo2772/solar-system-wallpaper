name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.11.1'

    - name: Build Debug APK
      run: gradle assembleDebug --stacktrace

    - name: Rename APK for Release
      run: |
        cp app/build/outputs/apk/debug/app-debug.apk SolarSystemWallpaper-v1.0.1.apk

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SolarSystemWallpaper-v1.0.1-APK
        path: SolarSystemWallpaper-v1.0.1.apk
        retention-days: 30

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      if: github.ref == 'refs/heads/main'
      with:
        tag_name: v1.0.1
        name: Solar System Live Wallpaper v1.0.1 (Hotfix)
        body: |
          ### 🪐 Solar System Live Wallpaper v1.0.1 (Black Screen Fix)
          
          This update fixes the black screen issue:
          - ✅ Forwarded `surfaceCreated`, `surfaceChanged`, and `surfaceDestroyed` callbacks to `GLSurfaceView` in the wallpaper engine.
          - ✅ Added interactive live 3D solar system preview directly inside the main app screen.
          - ✅ High-performance single-pass starfield skybox (eliminating heavy nested fragment shader loops).
          - ✅ Cross-GPU compatible TBN normal vector interpolation.
          - ✅ High precision GLSL float configuration.
          
          Download the updated APK below.
        files: SolarSystemWallpaper-v1.0.1.apk
        token: ${{ secrets.GITHUB_TOKEN }}
