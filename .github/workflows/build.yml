name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.11.1'

    - name: Build Debug APK
      run: gradle assembleDebug --stacktrace

    - name: Rename APK for Release
      run: |
        cp app/build/outputs/apk/debug/app-debug.apk SolarSystemWallpaper-v1.0.4.apk

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SolarSystemWallpaper-v1.0.4-APK
        path: SolarSystemWallpaper-v1.0.4.apk
        retention-days: 30

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      if: github.ref == 'refs/heads/main'
      with:
        tag_name: v1.0.4
        name: Solar System Live Wallpaper v1.0.4
        body: |
          Solar System Live Wallpaper v1.0.4:
          - Disabled touch interaction on the live wallpaper itself so home screen gestures and icons are never interrupted (only page-swipe parallax & unlock zoom remain active).
          - Upgraded procedural textures to 1024x512 + GPU micro-detail, linear-space PBR lighting, ACES Filmic tone mapping, Earth ocean specular glint, and accurate Saturn ring shadows.
          - Redesigned app UI with true edge-to-edge glassmorphic HUD, dynamic planet telemetry, and clean selector pills.
        files: SolarSystemWallpaper-v1.0.4.apk
        token: ${{ secrets.GITHUB_TOKEN }}