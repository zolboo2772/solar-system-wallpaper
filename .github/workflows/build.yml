name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.11.1'

    - name: Build Debug APK
      run: gradle assembleDebug --stacktrace

    - name: Rename APK for Release
      run: |
        cp app/build/outputs/apk/debug/app-debug.apk SolarSystemWallpaper-v1.0.6.apk

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SolarSystemWallpaper-v1.0.6-APK
        path: SolarSystemWallpaper-v1.0.6.apk
        retention-days: 30

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      if: github.ref == 'refs/heads/main'
      with:
        tag_name: v1.0.6
        name: Solar System Live Wallpaper v1.0.6
        body: |
          Solar System Live Wallpaper v1.0.6:
          - Added Earth's orbiting Moon, volumetric outer atmosphere & solar corona halo shells, and glowing orbital tracks in All Solar System mode.
          - Anchored Hero Mode camera to the sunlit crescent side so planets stay dramatically lit while rotating on their axis.
          - Frame-rate independent camera inertia damping across 60Hz and 120Hz displays.
          - Added Lighting Contrast & Orbit Tracks settings, planet telemetry badge, and cosmic launcher/preview icon.
        files: SolarSystemWallpaper-v1.0.6.apk
        token: ${{ secrets.GITHUB_TOKEN }}