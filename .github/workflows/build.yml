name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.11.1'

    - name: Build Debug APK
      run: gradle assembleDebug --stacktrace

    - name: Rename APK for Release
      run: |
        cp app/build/outputs/apk/debug/app-debug.apk SolarSystemWallpaper-v1.0.2.apk

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SolarSystemWallpaper-v1.0.2-APK
        path: SolarSystemWallpaper-v1.0.2.apk
        retention-days: 30

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      if: github.ref == 'refs/heads/main'
      with:
        tag_name: v1.0.2
        name: Solar System Live Wallpaper v1.0.2 (Stability & Visual Overhaul)
        body: |
          ### 🪐 Solar System Live Wallpaper v1.0.2
          
          This release addresses multiple critical bugs, edge cases, and visual improvements:
          - 🛡️ **Sphere Winding Order Fix**: Fixed inverted triangle index ordering in `MeshGenerator` so front faces are correctly CCW and never culled by back-face culling (`GL_CULL_FACE`).
          - 🌌 **Skybox Inside-Cube Rendering**: Disabled culling during skybox pass so stars render completely around the 360° celestial sphere.
          - 🔒 **Idempotent Surface Callbacks**: Ensured `surfaceCreated` and `surfaceDestroyed` in `WallpaperGLSurfaceView` execute safely without duplicate triggers or GLThread deadlocks.
          - 🎨 **Enhanced High-Res Procedural Textures**: Realistic multi-layered planet textures (Earth continents, oceans, clouds, and night lights; Jupiter belts with Great Red Spot; Saturn concentric rings with Cassini division gap; Mars polar ice caps & basalt canyons).
          - 🖐️ **In-App Touch Gesture Support**: Attached touch listeners to the interactive 3D preview view for seamless dragging, zooming, and planet inspection directly in the app.
          - ⚡ **Zero-Division & Precision Protection**: Guarded projection matrices against zero/negative viewport dimensions and configured 24-bit depth buffers (`8-8-8-8-24-0`) for the Samsung Galaxy S25 Ultra display.
          - 🧵 **Thread-Safe GL Teardown**: Queued OpenGL resource disposal onto the active GL thread via `glSurfaceView.queueEvent`.
        files: SolarSystemWallpaper-v1.0.2.apk
        token: ${{ secrets.GITHUB_TOKEN }}
